application.security.jwt.expiration= 86400000
application.security.jwt.refresh-token.expiration= 604800000
#
# Set maximum file upload size
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# DataSource settings: dve odvojene in-memory baze, isto kao apv/pgodina u produkciji
# (vidi IndirektniPSF.backend.config.DataSourceConfig)
app.datasource.apv.url=jdbc:h2:mem:apv;DB_CLOSE_DELAY=-1
app.datasource.apv.username=sa
app.datasource.apv.password=sa
app.datasource.apv.driver-class-name=org.h2.Driver

app.datasource.pgodina.url=jdbc:h2:mem:pgodina;DB_CLOSE_DELAY=-1
app.datasource.pgodina.username=sa
app.datasource.pgodina.password=sa
app.datasource.pgodina.driver-class-name=org.h2.Driver

# Hibernate ddl auto (create, create-drop, validate, update)
spring.jpa.hibernate.ddl-auto=create-drop

# Show or not log for each sql query
spring.jpa.show-sql=true

# Hibernate dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Hibernate format SQL
spring.jpa.properties.hibernate.format_sql=true

# File upload path (consider changing to a relative path or a configuration variable)
upload.path=C:/Users/Simo/Desktop/Fakture

